name: test

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hooktester och uppsättningsskripten
        run: node --test scripts/test/*.test.mjs plugins/android/hooks/test/*.test.mjs
      - name: Skalskript
        run: bash -n scripts/android-sdk.sh
